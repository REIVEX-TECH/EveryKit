<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="EveryKit QR">
  <!-- The three finder squares a scanner looks for first, which is the one
       shape everybody recognises as a QR code without being told. -->
  <rect x="6" y="6" width="14" height="14" rx="3" fill="#1d81f2"/>
  <rect x="10" y="10" width="6" height="6" rx="1.5" fill="#ffffff"/>
  <rect x="28" y="6" width="14" height="14" rx="3" fill="#ff8a4c"/>
  <rect x="32" y="10" width="6" height="6" rx="1.5" fill="#ffffff"/>
  <rect x="6" y="28" width="14" height="14" rx="3" fill="#1d81f2"/>
  <rect x="10" y="32" width="6" height="6" rx="1.5" fill="#ffffff"/>
  <rect x="28" y="28" width="5" height="5" rx="1.2" fill="#1d81f2"/>
  <rect x="37" y="28" width="5" height="5" rx="1.2" fill="#1d81f2"/>
  <rect x="28" y="37" width="5" height="5" rx="1.2" fill="#1d81f2"/>
  <rect x="37" y="37" width="5" height="5" rx="1.2" fill="#1d81f2"/>
</svg>
