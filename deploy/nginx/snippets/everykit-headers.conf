# Response headers and the per-address connection cap, shared by every
# EveryKit server block.
#
# Installed by deploy/edge.sh to /etc/nginx/snippets/everykit-headers.conf and
# included from each server block in useeverykit.conf. It is a snippet rather
# than fifteen copies because a security header that is right in thirteen
# places and missing in the fourteenth is worse than no rule at all.
#
# It cannot live at the http level: this box is shared with other sites, and an
# add_header there would apply to them too.
#
# `always` on every one of these, so they are still sent on a 404 or a 502. The
# default only adds them to 2xx and 3xx, which is exactly when nobody needs
# them.
#
# ## Why these live here and CSP does not
#
# These four are identical on all fourteen hosts, so nginx is the one place
# they belong and the apps no longer set them. Content-Security-Policy is
# different for every kit, because each one names the origins its own tools
# actually load from, so it stays in that kit's next.config.ts where the list
# it describes is.
#
# X-Frame-Options and the apps' `frame-ancestors 'none'` say the same thing to
# two generations of browser. They agree, so they do not fight; the hub has no
# CSP of its own, and this is what covers it.

add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# One address should not be able to hold every worker slot open. Generous
# enough that a browser opening several connections for one page never notices,
# and low enough that a single machine cannot sit on the box.
limit_conn everykit_conn 24;
