# EveryKit: fourteen Next apps under PM2 on localhost, fronted by nginx.
#   apex     useeverykit.com         -> 127.0.0.1:3010  (hub)
#   www      www.useeverykit.com     -> 301 to apex
#   photos   photos.useeverykit.com  -> 127.0.0.1:3011
#   letters  letters.useeverykit.com -> 127.0.0.1:3012
#   pdf      pdf.useeverykit.com     -> 127.0.0.1:3013
#   qr       qr.useeverykit.com      -> 127.0.0.1:3014
#   images   images.useeverykit.com  -> 127.0.0.1:3015
#   backgnd  background.useeverykit.com -> 127.0.0.1:3018
#   text     text.useeverykit.com    -> 127.0.0.1:3020
#   sign     sign.useeverykit.com    -> 127.0.0.1:3016
#   invoice  invoice.useeverykit.com -> 127.0.0.1:3017
#   ringtone ringtone.useeverykit.com -> 127.0.0.1:3019
#   dev      dev.useeverykit.com -> 127.0.0.1:3021
#   study    study.useeverykit.com -> 127.0.0.1:3022
#   calc     calc.useeverykit.com -> 127.0.0.1:3023
#
# HTTP-only until DNS points here; then:
#   certbot --nginx -d useeverykit.com -d www.useeverykit.com \
#     -d photos.useeverykit.com -d letters.useeverykit.com
# adds the 443 blocks and the 80->443 redirects automatically.

# ---------------------------------------------------------------------------
# Rate limit zones
# ---------------------------------------------------------------------------
#
# These are definitions, not behaviour: a zone costs a slab of shared memory
# and does nothing until a `limit_req` names it. That is why they are safe to
# declare here, at the http level of a box that serves other sites, while the
# add_header directives are not.
#
# Keyed on $binary_remote_addr, which is the address in four bytes rather than
# as text, so 10m holds on the order of 160,000 of them. nginx is the edge here
# with nothing in front of it, so that address is the real client.
#
# Nothing is written down. The zone is a fixed-size ring in memory that forgets
# an address as soon as it stops being busy, and it does not survive a reload.
# The privacy pages say so in the same words.

# The write path: the sign-up form and the admin login. A person submits an
# address once, so six a minute is generous and a script trying a password list
# hits the wall on its seventh attempt. burst=5 nodelay lets a fumbled login be
# retried immediately without queueing.
limit_req_zone $binary_remote_addr zone=everykit_write:10m rate=6r/m;

# The pageview beacon, which fires once per page. Somebody clicking through a
# kit quickly can genuinely do one a second, so this is set well above real use
# and only catches a machine.
limit_req_zone $binary_remote_addr zone=everykit_hit:10m rate=120r/m;

# Concurrent connections per address; see the headers snippet, which applies it.
limit_conn_zone $binary_remote_addr zone=everykit_conn:10m;

# Shared proxy settings for the three app blocks.
# (Defined once; included per-location below.)

server {
    listen 80;
    listen [::]:80;
    server_name useeverykit.com;

    include /etc/nginx/snippets/everykit-headers.conf;

    client_max_body_size 10M;

    # The proxy settings below are repeated rather than factored out: these
    # locations differ only in their limits, and an include would hide which
    # port a request actually reaches.

    # The email address. One submission per person, so the limit is about a
    # script filling the table rather than about a human being fast. The body
    # is an email and a kit slug; 8k is roughly two hundred times what that
    # needs, and anything larger is not a sign-up.
    location = /api/subscribe {
        limit_req zone=everykit_write burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # The pageview beacon. Set above real browsing rather than at it, because a
    # false positive here silently loses counts and nobody would notice.
    location = /api/hit {
        limit_req zone=everykit_hit burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # The login page and the endpoint behind it. The app already locks an
    # account out after repeated failures within its own process; this is the
    # part that does not care how many processes there are, and it is the only
    # per-address throttle in front of a password.
    # The optional trailing slash matters: without it a request to
    # /admin/login/ misses this block entirely and falls through to the
    # unlimited catch-all below, which is the whole throttle gone.
    location ~ ^/(admin/login|api/admin/login)/?$ {
        limit_req zone=everykit_write burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

