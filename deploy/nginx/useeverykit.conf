# EveryKit: nine Next apps under PM2 on localhost, fronted by nginx.
#   apex     useeverykit.com         -> 127.0.0.1:3010  (hub)
#   www      www.useeverykit.com     -> 301 to apex
#   photos   photos.useeverykit.com  -> 127.0.0.1:3011
#   letters  letters.useeverykit.com -> 127.0.0.1:3012
#   pdf      pdf.useeverykit.com     -> 127.0.0.1:3013
#   qr       qr.useeverykit.com      -> 127.0.0.1:3014
#   images   images.useeverykit.com  -> 127.0.0.1:3015
#   backgnd  background.useeverykit.com -> 127.0.0.1:3018
#   text     text.useeverykit.com    -> 127.0.0.1:3020
#   sign     sign.useeverykit.com    -> 127.0.0.1:3016
#
# HTTP-only until DNS points here; then:
#   certbot --nginx -d useeverykit.com -d www.useeverykit.com \
#     -d photos.useeverykit.com -d letters.useeverykit.com
# adds the 443 blocks and the 80->443 redirects automatically.

# Shared proxy settings for the three app blocks.
# (Defined once; included per-location below.)

server {
    listen 80;
    listen [::]:80;
    server_name useeverykit.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.useeverykit.com;
    return 301 https://useeverykit.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name photos.useeverykit.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name letters.useeverykit.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pdf.useeverykit.com;

    # Nothing is posted to this app - every file is handled in the browser -
    # so this only ever has to cover an ordinary page request. It matches the
    # other blocks rather than being tuned down, so all four stay the same.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name qr.useeverykit.com;

    # Nothing is posted to this app either - a code is drawn in the browser
    # from what is typed, and never sent here. Matches the other blocks so all
    # five stay the same.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name images.useeverykit.com;

    # No photo is posted here either - every image is decoded and re-encoded in
    # the browser. Matches the other blocks so all six stay the same.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name background.useeverykit.com;

    # No image is posted here: the cutout happens in the browser and only model
    # weights come in from the CDN. Matches the other blocks so all seven stay
    # the same.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name text.useeverykit.com;

    # Nothing is posted here at all: every count and conversion happens in the
    # page. Matches the other blocks so all eight stay the same.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sign.useeverykit.com;

    # Nothing is posted here: the signature and the document are handled in the
    # browser. Matches the other blocks so all nine stay the same.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
