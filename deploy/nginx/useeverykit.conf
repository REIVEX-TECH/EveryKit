# EveryKit — three Next apps under PM2 on localhost, fronted by nginx.
#   apex     useeverykit.com         -> 127.0.0.1:3010  (hub)
#   www      www.useeverykit.com     -> 301 to apex
#   photos   photos.useeverykit.com  -> 127.0.0.1:3011
#   letters  letters.useeverykit.com -> 127.0.0.1:3012
#
# HTTP-only until DNS points here; then:
#   certbot --nginx -d useeverykit.com -d www.useeverykit.com \
#     -d photos.useeverykit.com -d letters.useeverykit.com
# adds the 443 blocks and the 80->443 redirects automatically.

# Shared proxy settings for the three app blocks.
# (Defined once; included per-location below.)

server {
    listen 80;
    listen [::]:80;
    server_name useeverykit.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.useeverykit.com;
    return 301 https://useeverykit.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name photos.useeverykit.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name letters.useeverykit.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pdf.useeverykit.com;

    # Nothing is posted to this app - every file is handled in the browser -
    # so this only ever has to cover an ordinary page request. It matches the
    # other blocks rather than being tuned down, so all four stay the same.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
